<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCB</title>
    <link rel="icon" type="image/x-icon" href="jc-favicon.ico">
    <style>
        :root {
            --bg: #141414;
            --card: #1F1F1F;
            --btn: #2b2b2b;
            --accent: #CFE980;
            --text: #ffffff;
            --muted: #9a9a9a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            color: var(--text);
            overflow-x: hidden;
            padding: 24px 16px;
        }

        /* Particle canvas */
        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* Soft glow that follows the cursor */
        .cursor-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(207,233,128,0.12), transparent 65%);
            transform: translate(-50%, -50%);
            z-index: 0;
            left: 50%;
            top: 50%;
        }

        .scene {
            position: relative;
            z-index: 1;
            perspective: 1000px;
        }

        .card {
            position: relative;
            width: min(550px, 100%);
            padding: 48px 40px 44px;
            background: linear-gradient(160deg, #232323, #1a1a1a);
            border-radius: 32px;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both;
        }

        /* Animated gradient border */
        .card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            background: conic-gradient(from var(--angle, 0deg), transparent 0%, var(--accent) 12%, transparent 30%, transparent 60%, #7be0b0 75%, transparent 90%);
            z-index: -2;
            animation: spin 6s linear infinite;
            opacity: 0.85;
        }
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 32px;
            background: linear-gradient(160deg, #232323, #1a1a1a);
            z-index: -1;
        }

        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes spin { to { --angle: 360deg; } }
        @keyframes rise {
            from { opacity: 0; transform: translateY(40px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            width: 128px;
            height: 128px;
            margin: 0 auto 20px;
            transform: translateZ(50px);
        }
        .avatar-wrap::before {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(var(--accent), #7be0b0, var(--accent));
            animation: rotate 4s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
                    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        }
        @keyframes rotate { to { transform: rotate(360deg); } }

        .avatar-wrap img,
        .avatar-wrap .fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 4px solid var(--card);
        }
        .avatar-wrap .fallback {
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #141414;
            background: var(--accent);
        }
        .status {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 18px;
            height: 18px;
            background: #4ade80;
            border: 3px solid var(--card);
            border-radius: 50%;
        }
        .status::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid #4ade80;
            animation: ping 1.8s ease-out infinite;
        }
        @keyframes ping {
            from { transform: scale(1); opacity: .8; }
            to   { transform: scale(2.2); opacity: 0; }
        }

        h1 {
            font-size: 1.9rem;
            line-height: 1.2;
            background: linear-gradient(90deg, #fff, var(--accent), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 5s linear infinite, pop .8s .2s both;
            transform: translateZ(35px);
        }
        @keyframes shine { to { background-position: 200% center; } }

        .location {
            margin-top: 10px;
            color: var(--accent);
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: pop .8s .35s both;
        }
        .location svg { width: 16px; height: 16px; fill: var(--accent); }

        .tagline {
            margin-top: 18px;
            min-height: 1.6em;
            font-size: 1.05rem;
            color: #e8e8e8;
            font-style: italic;
            animation: pop .8s .5s both;
        }
        .tagline .caret {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            margin-left: 3px;
            background: var(--accent);
            vertical-align: middle;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            animation: pop .8s .65s both;
        }
        .chips span {
            font-size: .78rem;
            padding: 6px 12px;
            border-radius: 999px;
            color: var(--accent);
            background: rgba(207,233,128,0.08);
            border: 1px solid rgba(207,233,128,0.25);
            transition: transform .2s, background .2s;
        }
        .chips span:hover {
            transform: translateY(-3px);
            background: rgba(207,233,128,0.18);
        }

        .links {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transform: translateZ(25px);
        }
        .link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 22px;
            height: 54px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            background: var(--btn);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .25s, box-shadow .25s, color .25s;
            animation: pop .8s both;
        }
        .link:nth-child(1) { animation-delay: .8s; }
        .link:nth-child(2) { animation-delay: .95s; }
        .link:nth-child(3) { animation-delay: 1.1s; }

        .link::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--accent);
            transform: translateX(-101%);
            transition: transform .35s cubic-bezier(.2,.8,.2,1);
            z-index: 0;
        }
        .link:hover::before { transform: translateX(0); }
        .link:hover {
            color: #141414;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(207,233,128,0.25);
        }
        .link svg, .link span, .link .arrow { position: relative; z-index: 1; }
        .link svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
        .link span { flex: 1; text-align: left; font-weight: 600; }
        .link .arrow { transition: transform .3s; opacity: .7; }
        .link:hover .arrow { transform: translateX(6px); opacity: 1; }

        .footer {
            margin-top: 28px;
            font-size: .78rem;
            color: var(--muted);
            animation: pop .8s 1.3s both;
        }

        @media (max-width: 480px) {
            .card { padding: 40px 22px 36px; border-radius: 26px; }
            h1 { font-size: 1.5rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="cursor-glow" id="glow"></div>

    <main class="scene">
        <section class="card" id="card">
            <div class="avatar-wrap">
                <img src="C.jpg" alt="Photo of John Charlie" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="fallback">JC</div>
                <div class="status" title="Online"></div>
            </div>

            <h1>John Charlie B. Bacla-an</h1>

            <p class="location">
                <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
                Olango Island, Lapu-lapu City
            </p>

            <p class="tagline"><span id="typed"></span><span class="caret"></span></p>

            <div class="chips">
                <span>💻 Developer</span>
                <span>🌴 Island Life</span>
                <span>🚀 Always Learning</span>
            </div>

            <nav class="links">
                <a class="link" href="https://github.com/JohnCharlieBacla-an" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a10.9 10.9 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>
                    <span>GitHub</span>
                    <b class="arrow">→</b>
                </a>
                <a class="link" href="https://www.facebook.com/JohnCharlieBolvax" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24"><path d="M24 12a12 12 0 1 0-13.88 11.85v-8.38H7.08V12h3.04V9.36c0-3 1.8-4.67 4.54-4.67 1.31 0 2.69.23 2.69.23v2.95h-1.52c-1.49 0-1.96.93-1.96 1.88V12h3.34l-.53 3.47h-2.81v8.38A12 12 0 0 0 24 12z"/></svg>
                    <span>Facebook</span>
                    <b class="arrow">→</b>
                </a>
                <a class="link" href="https://www.instagram.com/charliebaclaan/" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85C2.38 3.92 3.9 2.38 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16zM12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.69.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.2-4.35-2.62-6.78-6.98-6.98C15.67.01 15.26 0 12 0zm0 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.85a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z"/></svg>
                    <span>Instagram</span>
                    <b class="arrow">→</b>
                </a>
            </nav>

            <p class="footer">© <span id="year"></span> John Charlie B. Bacla-an</p>
        </section>
    </main>

    <script>
        // ---------- Typing effect ----------
        const phrases = [
            "Tired of being Handsome",
            "Coding from Olango Island 🌊",
            "Turning coffee into code ☕",
            "Tired of being Handsome"
        ];
        const typed = document.getElementById("typed");
        let p = 0, c = 0, deleting = false;

        function type() {
            const word = phrases[p];
            typed.textContent = deleting ? word.slice(0, --c) : word.slice(0, ++c);
            let delay = deleting ? 40 : 85;

            if (!deleting && c === word.length) {
                delay = 1800;
                deleting = true;
                if (p === phrases.length - 1) { p = -1; }
            } else if (deleting && c === 0) {
                deleting = false;
                p = (p + 1) % phrases.length;
                delay = 400;
            }
            setTimeout(type, delay);
        }
        type();

        // ---------- 3D tilt ----------
        const card = document.getElementById("card");
        const scene = document.querySelector(".scene");
        scene.addEventListener("mousemove", (e) => {
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            card.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
        });
        scene.addEventListener("mouseleave", () => {
            card.style.transform = "rotateY(0) rotateX(0)";
        });

        // ---------- Cursor glow ----------
        const glow = document.getElementById("glow");
        window.addEventListener("mousemove", (e) => {
            glow.style.left = e.clientX + "px";
            glow.style.top = e.clientY + "px";
        });

        // ---------- Particle background ----------
        const canvas = document.getElementById("bg");
        const ctx = canvas.getContext("2d");
        let w, h, dots;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            const count = Math.min(90, Math.floor((w * h) / 18000));
            dots = Array.from({ length: count }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                r: Math.random() * 1.8 + 0.6
            }));
        }
        resize();
        window.addEventListener("resize", resize);

        function draw() {
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < dots.length; i++) {
                const a = dots[i];
                a.x += a.vx; a.y += a.vy;
                if (a.x < 0 || a.x > w) a.vx *= -1;
                if (a.y < 0 || a.y > h) a.vy *= -1;

                ctx.beginPath();
                ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(207,233,128,0.55)";
                ctx.fill();

                for (let j = i + 1; j < dots.length; j++) {
                    const b = dots[j];
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d < 120) {
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(207,233,128,${0.12 * (1 - d / 120)})`;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }
        draw();

        // ---------- Footer year ----------
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
